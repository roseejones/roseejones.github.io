---
layout: not_homepage
---

<div class="container">
    <header class="page-head">
        <p class="kicker"><span class="path">~/topics</span> $ ls</p>
        <h1 class="page-title">Deep dives into areas I work in</h1>
    </header>

    <div class="tile-grid">
        {% for topic in site.data.topics %}
        <a class="tile" href="{{ topic.url }}">
            <span class="tile-no">0{{ forloop.index }}</span> <span class="tile-tag">/ topic</span>
            <h2 class="tile-title">{{ topic.title }}</h2>
            <p class="tile-desc">{{ topic.description }}</p>
            <span class="tile-link">view slides + resources -&gt;</span>
        </a>
        {% endfor %}
    </div>
</div>
