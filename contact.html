---
layout: not_homepage
---

<div class="container">
    <header class="page-head">
        <p class="kicker"><span class="path">~/contact</span> $ mail</p>
        <h1 class="page-title">Have questions, comments, feedback?</h1>
        <p class="standfirst">
            Feel free to reach out using the form below or email
            <a class="about_me_links" href="mailto:mlengineer@abine.org?subject=roseejones.github.io">mlengineer@abine.org</a>
        </p>
    </header>

    <div class="panel">
        <form id="fs-frm" name="simple-contact-form" accept-charset="utf-8"
            action="https://formspree.io/mlengineer@abine.org" method="post">

            <div class="row">
                <div class="input-field col m6 s12">
                    <i class="material-icons prefix">account_circle</i>
                    <label for="icon_prefix">Name</label>
                    <input id="icon_prefix" type="text" name="name" class="validate email_input" required="">
                </div>

                <div class="input-field col m6 s12">
                    <i class="material-icons prefix">email</i>
                    <label for="icon_prefix2" data-error="Make sure you've entered a valid email">Email</label>
                    <input id="icon_prefix2" name="_replyto" type="email" class="validate email_input" required="">
                </div>
            </div>

            <div class="row">
                <div class="input-field col s12">
                    <i class="material-icons prefix">mode_edit</i>
                    <textarea id="textarea1" aria-required="true" name="message"
                        class="materialize-textarea email_input validate" required=""></textarea>
                    <label for="textarea1" data-error="Make sure you've entered a message">Message</label>
                </div>
            </div>

            <div class="row">
                <button class="fill col s8 offset-s2 m4 offset-m4" type="submit" name="action">Send</button>
            </div>

        </form>
    </div>
</div>
