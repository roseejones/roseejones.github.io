layout: not_homepage
permalink: /projects/

<div class="container">
  <header class="page-head">
    <p class="kicker"><span class="path">~/projects</span> $ ls</p>
    <h1 class="page-title">Projects and experiments</h1>
  </header>

  <div class="tile-grid project_list">
    {% for project in site.data.projects %}
      {% include project_box.html index=forloop.index %}
    {% endfor %}
  </div>

  <div class="projects-bottom center-align">
    <h2 class="heading">Have questions, comments, feedback? Feel free to reach out!</h2>
    <div class="row">
      <div class="col m6 offset-m3 s12">
        <div class="row">
          <div class="col s6">
            <a href="/contact"><button type="button" class="fill col s12" name="button">contact</button></a>
          </div>
          <div class="col s6">
            <button type="button" class="fill col s12" id="scroll-top" title="scroll back top" name="button">scroll back top</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
